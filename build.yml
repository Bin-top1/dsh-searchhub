name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Ensure runtime files exist
        run: node -e "['lib/index.js','lib/client.js','cordis.patch.yml'].forEach(function(f){if(!require('fs').existsSync(f))throw new Error('missing '+f)})"
      - name: Syntax-check runtime halves
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Confirm npm pack contents
        run: npm pack --dry-run